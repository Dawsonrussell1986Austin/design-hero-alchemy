<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Oak Roswell RSVP Form</title>
    <style>
      :root {
        --oak-primary: #c0a154;
        --oak-primary-dark: #142a20;
        --oak-text: #1f2421;
        --oak-muted: #6b7280;
        --oak-border: #d5d8d4;
        --oak-focus: rgba(192, 161, 84, 0.25);
        --oak-radius: 6px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        background: transparent;
        margin: 0;
        min-height: 100%;
      }

      body {
        color: var(--oak-text);
        font-family: Inter, "Helvetica Neue", Arial, sans-serif;
      }

      form {
        margin: 0 auto;
        max-width: 480px;
      }

      .form-field {
        margin: 0 0 18px;
      }

      label {
        color: var(--oak-text);
        display: block;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.01em;
        margin-bottom: 6px;
      }

      input.text,
      input[type="text"],
      input[type="email"],
      input[type="tel"] {
        appearance: none;
        background: #ffffff;
        border: 1px solid var(--oak-border);
        border-radius: var(--oak-radius);
        color: var(--oak-text);
        font: 15px Inter, "Helvetica Neue", Arial, sans-serif;
        padding: 11px 13px;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
        width: 100%;
      }

      input.text:focus,
      input[type="text"]:focus,
      input[type="email"]:focus,
      input[type="tel"]:focus {
        border-color: var(--oak-primary);
        box-shadow: 0 0 0 3px var(--oak-focus);
        outline: none;
      }

      .hidden-field {
        left: -9999px;
        position: absolute;
        top: -9999px;
        visibility: hidden;
        width: 190px;
      }

      .submit {
        margin: 20px 0 0;
      }

      input[type="submit"] {
        appearance: none;
        background: var(--oak-primary);
        border: 0;
        border-radius: var(--oak-radius);
        color: #ffffff;
        cursor: pointer;
        display: inline-block;
        font: 600 15px Inter, "Helvetica Neue", Arial, sans-serif;
        letter-spacing: 0.02em;
        padding: 13px 24px;
        transition: background 0.15s ease, transform 0.05s ease;
        width: 100%;
      }

      input[type="submit"]:hover {
        background: var(--oak-primary-dark);
      }

      input[type="submit"]:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <form
      accept-charset="UTF-8"
      method="post"
      action="https://go.oakrepartners.com/l/1105131/2026-08-26/b5chv2"
      id="pardot-form"
    >
      <p class="form-field first_name pd-text required">
        <label for="1105131_417988pi_1105131_417988">First Name</label>
        <input
          type="text"
          name="1105131_417988pi_1105131_417988"
          id="1105131_417988pi_1105131_417988"
          class="text"
          size="30"
          maxlength="40"
          required
        >
      </p>

      <p class="form-field last_name pd-text required">
        <label for="1105131_417991pi_1105131_417991">Last Name</label>
        <input
          type="text"
          name="1105131_417991pi_1105131_417991"
          id="1105131_417991pi_1105131_417991"
          class="text"
          size="30"
          maxlength="80"
          required
        >
      </p>

      <p class="form-field company pd-text required">
        <label for="1105131_418000pi_1105131_418000">Company Name</label>
        <input
          type="text"
          name="1105131_418000pi_1105131_418000"
          id="1105131_418000pi_1105131_418000"
          class="text"
          size="30"
          maxlength="255"
          required
        >
      </p>

      <p class="form-field email pd-text required">
        <label for="1105131_417994pi_1105131_417994">Email</label>
        <input
          type="email"
          name="1105131_417994pi_1105131_417994"
          id="1105131_417994pi_1105131_417994"
          class="text"
          size="30"
          maxlength="255"
          required
        >
      </p>

      <p class="form-field phone pd-text">
        <label for="1105131_417997pi_1105131_417997">Phone</label>
        <input
          type="tel"
          name="1105131_417997pi_1105131_417997"
          id="1105131_417997pi_1105131_417997"
          class="text"
          size="30"
          maxlength="40"
        >
      </p>

      <p class="hidden-field">
        <label for="pi_extra_field">Comments</label>
        <input type="text" name="pi_extra_field" id="pi_extra_field">
      </p>

      <input name="_utf8" type="hidden" value="&#9731;">
      <input type="hidden" name="hiddenDependentFields" id="hiddenDependentFields" value="">

      <p class="submit">
        <input type="submit" accesskey="s" value="RSVP Now">
      </p>
    </form>
  </body>
</html>
